<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audi RS6 Avant Performance | Rawgadz Vehicles</title>
  <meta name="description" content="Twin-turbocharged 4.0-liter V8 producing 621 hp, quattro permanent all-wheel drive, and aggressive widebody wagon styling.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/stock.js"></script>
  <script src="/js/meta-pixel.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FBFBFB] text-neutral-900 font-sans antialiased selection:bg-black selection:text-white pb-20">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../car.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Cars
      </a>
      <a href="../index.html" class="font-black text-lg tracking-wider text-black uppercase hover:opacity-80 transition-opacity">Rawgadz</a>
      <div class="w-20"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-10" x-data="carPage">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-7">
        <div class="aspect-video bg-neutral-100 rounded-2xl overflow-hidden border border-neutral-200 mb-4 shadow-sm">
          <img :src="currentImage" :alt="car.title" class="w-full h-full object-cover">
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-2" x-show="galleryImages.length > 1">
          <template x-for="(img, idx) in galleryImages" :key="idx">
            <button @click="selectedGalleryImage = img" class="w-20 h-14 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0" :class="currentImage === img ? 'border-black' : 'border-transparent opacity-60 hover:opacity-100'">
              <img :src="img" class="w-full h-full object-cover">
            </button>
          </template>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap gap-2 mb-3"><span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">wagon</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">luxury</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">v8</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">audi</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">quattro</span></div>
          <h1 class="text-3xl md:text-4xl font-black tracking-tight text-neutral-900 mb-2" x-text="car.title"></h1>
          <p class="text-sm text-neutral-500 font-medium mb-4" x-text="car.subtitle"></p>
          <div class="text-2xl font-black text-black mb-6">
            Starting at ৳<span x-text="Number(car.price || 0).toLocaleString()"></span>
          </div>

          <div class="text-neutral-600 text-sm leading-relaxed mb-6" x-text="car.description"></div>

          <div class="border-t border-neutral-200 pt-6 mt-6">
            <a :href="inquiryUrl" class="w-full bg-black hover:bg-neutral-800 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-sm uppercase tracking-wider transition-all">
              Inquire About Vehicle
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-16 border-t border-neutral-200 pt-10" x-show="car.content">
      <h2 class="text-2xl font-black tracking-tight mb-6">Specifications & Details</h2>
      <div class="prose max-w-none text-neutral-700 bg-white p-6 md:p-8 rounded-2xl border border-neutral-200" x-html="car.content"></div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carPage', () => ({
        car: {"id":"car_003","title":"Audi RS6 Avant Performance","slug":"audi-rs6-avant-performance","subtitle":"","price":126800,"imageSrc":"https://placehold.co/1200x800/18181b/ffffff?text=Audi+RS6+Avant+Performance","images":["https://placehold.co/1200x800/18181b/ffffff?text=Audi+RS6+Avant+Front+Grille","https://placehold.co/1200x800/18181b/ffffff?text=Audi+RS6+Avant+Side+Wagon","https://placehold.co/1200x800/18181b/ffffff?text=Audi+RS6+Avant+Rear+Exhaust","https://placehold.co/1200x800/18181b/ffffff?text=Audi+RS6+Avant+Valcona+Interior"],"video":"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4","description":"Twin-turbocharged 4.0-liter V8 producing 621 hp, quattro permanent all-wheel drive, and aggressive widebody wagon styling.","tags":"wagon,luxury,v8,audi,quattro","types":[{"subProductId":"car_003_type_001","subTitle":"Nardo Gray / Black Optic Package","subImage":"https://placehold.co/1200x800/27272a/ffffff?text=Nardo+Gray","images":["https://placehold.co/1200x800/27272a/ffffff?text=Nardo+Gray+Front","https://placehold.co/1200x800/27272a/ffffff?text=Nardo+Gray+Side+Profile","https://placehold.co/1200x800/27272a/ffffff?text=Nardo+Gray+Rear+Diffuser","https://placehold.co/1200x800/27272a/ffffff?text=Nardo+Gray+Sport+Seats"],"subProducts":[{"subProductId":"car_003_type_001_sub_001","subTitle":"22\" 5-V-Spoke Cast Wheels","subImage":"https://placehold.co/1200x800/27272a/ffffff?text=22+Cast+Wheels","images":["https://placehold.co/1200x800/27272a/ffffff?text=22+Cast+Wheels+Angle","https://placehold.co/1200x800/27272a/ffffff?text=22+Cast+Wheels+Detail"]},{"subProductId":"car_003_type_001_sub_002","subTitle":"22\" Lightweight Forged Wheels + RS Sport Exhaust","subImage":"https://placehold.co/1200x800/27272a/ffffff?text=22+Lightweight+Forged","images":["https://placehold.co/1200x800/27272a/ffffff?text=22+Forged+Wheels+Milled","https://placehold.co/1200x800/27272a/ffffff?text=RS+Sport+Exhaust+Tips"],"price":135000}]},{"subProductId":"car_003_type_002","subTitle":"Ascari Blue Matte / Carbon Optic","subImage":"https://placehold.co/1200x800/1e3a8a/ffffff?text=Ascari+Blue","images":["https://placehold.co/1200x800/1e3a8a/ffffff?text=Ascari+Blue+Matte+Front","https://placehold.co/1200x800/1e3a8a/ffffff?text=Ascari+Blue+Matte+Side+Wagon","https://placehold.co/1200x800/1e3a8a/ffffff?text=Ascari+Blue+Carbon+Mirror","https://placehold.co/1200x800/1e3a8a/ffffff?text=Ascari+Blue+Blue+Stitched+Cabin"],"price":132000,"subProducts":[{"subProductId":"car_003_type_002_sub_001","subTitle":"Dynamic Package Plus with Ceramic Brakes","subImage":"https://placehold.co/1200x800/1e3a8a/ffffff?text=Carbon+Ceramic+Pack","images":["https://placehold.co/1200x800/1e3a8a/ffffff?text=Ceramic+Brakes+Rotors","https://placehold.co/1200x800/1e3a8a/ffffff?text=Dynamic+Plus+Top+Speed+Unlock"],"price":145000},{"subProductId":"car_003_type_002_sub_002","subTitle":"Standard Sport Package","subImage":"https://placehold.co/1200x800/1e3a8a/ffffff?text=Standard+Aero","images":["https://placehold.co/1200x800/1e3a8a/ffffff?text=Standard+RS+Aero+Kit"],"price":132000}]}],"content":"\u003ch1>Vehicle Overview\u003c/h1>\n\u003cp>The \u003cstrong>Audi RS6 Avant Performance\u003c/strong> blends supercar-grade acceleration with everyday wagon practicality:\u003c/p>\n\u003ch3>Engine &amp; Transmission\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Engine\u003c/strong>: 4.0L Twin-Turbocharged TFSI V8\u003c/li>\n\u003cli>\u003cstrong>Power\u003c/strong>: 621 hp @ 6,000 rpm\u003c/li>\n\u003cli>\u003cstrong>Torque\u003c/strong>: 627 lb-ft @ 2,300 rpm\u003c/li>\n\u003cli>\u003cstrong>0–60 mph\u003c/strong>: 3.3 seconds\u003c/li>\n\u003cli>\u003cstrong>Drivetrain\u003c/strong>: Permanent quattro All-Wheel Drive with Sport Differential\u003c/li>\n\u003cli>\u003cstrong>Transmission\u003c/strong>: 8-speed Tiptronic Automatic with Launch Control\u003c/li>\n\u003c/ul>\n\u003ch3>Luxury &amp; Cargo Versatility\u003c/h3>\n\u003cul>\n\u003cli>30 cubic feet of cargo volume behind second row (extends to 59.3 cu ft)\u003c/li>\n\u003cli>Valcona leather sports seats with honeycomb stitching and ventilation\u003c/li>\n\u003cli>Bang &amp; Olufsen 3D Advanced Sound System (1,820W, 19 speakers)\u003c/li>\n\u003c/ul>\n"},
        selectedGalleryImage: null,
        get galleryImages() {
          if (Array.isArray(this.car.images) && this.car.images.length > 0) return this.car.images;
          return this.car.imageSrc ? [this.car.imageSrc] : [];
        },
        get currentImage() {
          return this.selectedGalleryImage || this.galleryImages[0] || '';
        },
        get inquiryUrl() {
          const params = new URLSearchParams();
          if (this.car.id) params.set('car_id', this.car.id);
          if (this.car.title) params.set('vehicle', this.car.title);
          if (this.car.subtitle) params.set('trim', this.car.subtitle);
          if (this.car.price) params.set('est_price', this.car.price);
          return '../contact.html?' + params.toString();
        }
      }));
    });
  </script>
</body>
</html>
