<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Model S Plaid | Rawgadz Vehicles</title>
  <meta name="description" content="Tri-motor all-wheel-drive platform delivering 1,020 hp, carbon-sleeved rotors, and torque vectoring for unprecedented acceleration.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/stock.js"></script>
  <script src="/js/meta-pixel.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FBFBFB] text-neutral-900 font-sans antialiased selection:bg-black selection:text-white pb-20">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../car.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Cars
      </a>
      <a href="../index.html" class="font-black text-lg tracking-wider text-black uppercase hover:opacity-80 transition-opacity">Rawgadz</a>
      <div class="w-20"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-10" x-data="carPage">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-7">
        <div class="aspect-video bg-neutral-100 rounded-2xl overflow-hidden border border-neutral-200 mb-4 shadow-sm">
          <img :src="currentImage" :alt="car.title" class="w-full h-full object-cover">
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-2" x-show="galleryImages.length > 1">
          <template x-for="(img, idx) in galleryImages" :key="idx">
            <button @click="selectedGalleryImage = img" class="w-20 h-14 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0" :class="currentImage === img ? 'border-black' : 'border-transparent opacity-60 hover:opacity-100'">
              <img :src="img" class="w-full h-full object-cover">
            </button>
          </template>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap gap-2 mb-3"><span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">ev</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">electric</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">sedan</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">performance</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">autopilot</span></div>
          <h1 class="text-3xl md:text-4xl font-black tracking-tight text-neutral-900 mb-2" x-text="car.title"></h1>
          <p class="text-sm text-neutral-500 font-medium mb-4" x-text="car.subtitle"></p>
          <div class="text-2xl font-black text-black mb-6">
            Starting at ৳<span x-text="Number(car.price || 0).toLocaleString()"></span>
          </div>

          <div class="text-neutral-600 text-sm leading-relaxed mb-6" x-text="car.description"></div>

          <div class="border-t border-neutral-200 pt-6 mt-6">
            <a :href="inquiryUrl" class="w-full bg-black hover:bg-neutral-800 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-sm uppercase tracking-wider transition-all">
              Inquire About Vehicle
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-16 border-t border-neutral-200 pt-10" x-show="car.content">
      <h2 class="text-2xl font-black tracking-tight mb-6">Specifications & Details</h2>
      <div class="prose max-w-none text-neutral-700 bg-white p-6 md:p-8 rounded-2xl border border-neutral-200" x-html="car.content"></div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carPage', () => ({
        car: {"id":"car_002","title":"Tesla Model S Plaid","slug":"tesla-model-s-plaid","subtitle":"","price":89990,"imageSrc":"https://placehold.co/1200x800/0f172a/ffffff?text=Tesla+Model+S+Plaid","images":["https://placehold.co/1200x800/0f172a/ffffff?text=Tesla+Model+S+Plaid+Front","https://placehold.co/1200x800/0f172a/ffffff?text=Tesla+Model+S+Plaid+Profile","https://placehold.co/1200x800/0f172a/ffffff?text=Tesla+Model+S+Plaid+Rear","https://placehold.co/1200x800/0f172a/ffffff?text=Tesla+Model+S+Plaid+Interior+Yoke"],"video":"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4","description":"Tri-motor all-wheel-drive platform delivering 1,020 hp, carbon-sleeved rotors, and torque vectoring for unprecedented acceleration.","tags":"ev,electric,sedan,performance,autopilot","types":[{"subProductId":"car_002_type_001","subTitle":"Stealth Grey / All-Black Interior","subImage":"https://placehold.co/1200x800/1e293b/ffffff?text=Plaid+Stealth+Grey","images":["https://placehold.co/1200x800/1e293b/ffffff?text=Plaid+Stealth+Grey+Front","https://placehold.co/1200x800/1e293b/ffffff?text=Plaid+Stealth+Grey+Side","https://placehold.co/1200x800/1e293b/ffffff?text=Plaid+Stealth+Grey+Glass+Roof","https://placehold.co/1200x800/1e293b/ffffff?text=Plaid+Stealth+Grey+Cabin"],"subProducts":[{"subProductId":"car_002_type_001_sub_001","subTitle":"19\" Tempest Wheels (Range 359 mi)","subImage":"https://placehold.co/1200x800/1e293b/ffffff?text=19+Tempest+Wheels","images":["https://placehold.co/1200x800/1e293b/ffffff?text=19+Tempest+Wheels+CloseUp","https://placehold.co/1200x800/1e293b/ffffff?text=19+Tempest+Wheels+Side"]},{"subProductId":"car_002_type_001_sub_002","subTitle":"21\" Arachnid Track Wheels","subImage":"https://placehold.co/1200x800/1e293b/ffffff?text=21+Arachnid+Wheels","images":["https://placehold.co/1200x800/1e293b/ffffff?text=21+Arachnid+Wheels+Stance","https://placehold.co/1200x800/1e293b/ffffff?text=21+Arachnid+Wheels+Detail"],"price":94490}]},{"subProductId":"car_002_type_002","subTitle":"Ultra Red / Cream Luxury Interior","subImage":"https://placehold.co/1200x800/7f1d1d/ffffff?text=Plaid+Ultra+Red","images":["https://placehold.co/1200x800/7f1d1d/ffffff?text=Plaid+Ultra+Red+Front+ThreeQuarter","https://placehold.co/1200x800/7f1d1d/ffffff?text=Plaid+Ultra+Red+Side+View","https://placehold.co/1200x800/7f1d1d/ffffff?text=Plaid+Ultra+Red+Cream+Seats","https://placehold.co/1200x800/7f1d1d/ffffff?text=Plaid+Ultra+Red+Dashboard"],"price":92490,"subProducts":[{"subProductId":"car_002_type_002_sub_001","subTitle":"19\" Tempest Wheels","subImage":"https://placehold.co/1200x800/7f1d1d/ffffff?text=19+Tempest+Wheels","images":["https://placehold.co/1200x800/7f1d1d/ffffff?text=Ultra+Red+Tempest+Wheels"],"price":92490},{"subProductId":"car_002_type_002_sub_002","subTitle":"21\" Arachnid Track Wheels + Track Package","subImage":"https://placehold.co/1200x800/7f1d1d/ffffff?text=21+Arachnid+Wheels","images":["https://placehold.co/1200x800/7f1d1d/ffffff?text=Track+Package+Arachnid+Wheels","https://placehold.co/1200x800/7f1d1d/ffffff?text=Carbon+Ceramic+Rotors"],"price":109990}]}],"content":"\u003ch1>Vehicle Overview\u003c/h1>\n\u003cp>The \u003cstrong>Tesla Model S Plaid\u003c/strong> has the quickest acceleration of any vehicle in production:\u003c/p>\n\u003ch3>Powertrain &amp; Performance\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Motors\u003c/strong>: Tri-Motor All-Wheel Drive with Carbon-Sleeved Rotors\u003c/li>\n\u003cli>\u003cstrong>Power Output\u003c/strong>: 1,020 horsepower\u003c/li>\n\u003cli>\u003cstrong>0–60 mph\u003c/strong>: 1.99 seconds (with rollout subtracted)\u003c/li>\n\u003cli>\u003cstrong>Quarter Mile\u003c/strong>: 9.23 seconds @ 155 mph\u003c/li>\n\u003cli>\u003cstrong>Top Speed\u003c/strong>: 200 mph (with Track Package hardware)\u003c/li>\n\u003cli>\u003cstrong>Range (EPA Est.)\u003c/strong>: 359 miles\u003c/li>\n\u003c/ul>\n\u003ch3>Interior &amp; Technology\u003c/h3>\n\u003cul>\n\u003cli>17-inch cinematic display with 2200x1300 resolution\u003c/li>\n\u003cli>Wireless gaming console compute power (10 teraflops)\u003c/li>\n\u003cli>22-speaker, 960-watt premium audio system with active road noise reduction\u003c/li>\n\u003cli>Full Self-Driving Supervised hardware capability\u003c/li>\n\u003c/ul>\n"},
        selectedGalleryImage: null,
        get galleryImages() {
          if (Array.isArray(this.car.images) && this.car.images.length > 0) return this.car.images;
          return this.car.imageSrc ? [this.car.imageSrc] : [];
        },
        get currentImage() {
          return this.selectedGalleryImage || this.galleryImages[0] || '';
        },
        get inquiryUrl() {
          const params = new URLSearchParams();
          if (this.car.id) params.set('car_id', this.car.id);
          if (this.car.title) params.set('vehicle', this.car.title);
          if (this.car.subtitle) params.set('trim', this.car.subtitle);
          if (this.car.price) params.set('est_price', this.car.price);
          return '../contact.html?' + params.toString();
        }
      }));
    });
  </script>
</body>
</html>
