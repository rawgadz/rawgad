<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Porsche 911 GT3 RS | Rawgadz Vehicles</title>
  <meta name="description" content="4.0-liter naturally aspirated flat-six producing 518 hp, active aerodynamics, and track-honed double-wishbone front suspension.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/stock.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FBFBFB] text-neutral-900 font-sans antialiased selection:bg-black selection:text-white pb-20">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../car.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Cars
      </a>
      <a href="../index.html" class="font-black text-lg tracking-wider text-black uppercase hover:opacity-80 transition-opacity">Rawgadz</a>
      <div class="w-20"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-10" x-data="carPage">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-7">
        <div class="aspect-video bg-neutral-100 rounded-2xl overflow-hidden border border-neutral-200 mb-4 shadow-sm">
          <img :src="currentImage" :alt="car.title" class="w-full h-full object-cover">
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-2" x-show="galleryImages.length > 1">
          <template x-for="(img, idx) in galleryImages" :key="idx">
            <button @click="selectedGalleryImage = img" class="w-20 h-14 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0" :class="currentImage === img ? 'border-black' : 'border-transparent opacity-60 hover:opacity-100'">
              <img :src="img" class="w-full h-full object-cover">
            </button>
          </template>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap gap-2 mb-3"><span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">sports</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">supercar</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">track</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">porsche</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">coupe</span></div>
          <h1 class="text-3xl md:text-4xl font-black tracking-tight text-neutral-900 mb-2" x-text="car.title"></h1>
          <p class="text-sm text-neutral-500 font-medium mb-4" x-text="car.subtitle"></p>
          <div class="text-2xl font-black text-black mb-6">
            Starting at ৳<span x-text="Number(car.price || 0).toLocaleString()"></span>
          </div>

          <div class="text-neutral-600 text-sm leading-relaxed mb-6" x-text="car.description"></div>

          <div class="border-t border-neutral-200 pt-6 mt-6">
            <a :href="inquiryUrl" class="w-full bg-black hover:bg-neutral-800 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-sm uppercase tracking-wider transition-all">
              Inquire About Vehicle
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-16 border-t border-neutral-200 pt-10" x-show="car.content">
      <h2 class="text-2xl font-black tracking-tight mb-6">Specifications & Details</h2>
      <div class="prose max-w-none text-neutral-700 bg-white p-6 md:p-8 rounded-2xl border border-neutral-200" x-html="car.content"></div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carPage', () => ({
        car: {"id":"car_001","title":"Porsche 911 GT3 RS","slug":"porsche-911-gt3-rs","subtitle":"","price":241300,"imageSrc":"https://placehold.co/1200x800/171717/ffffff?text=Porsche+911+GT3+RS","images":["https://placehold.co/1200x800/171717/ffffff?text=Porsche+911+GT3+RS+Front","https://placehold.co/1200x800/171717/ffffff?text=Porsche+911+GT3+RS+Side","https://placehold.co/1200x800/171717/ffffff?text=Porsche+911+GT3+RS+Rear+Wing","https://placehold.co/1200x800/171717/ffffff?text=Porsche+911+GT3+RS+Cockpit"],"video":"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4","description":"4.0-liter naturally aspirated flat-six producing 518 hp, active aerodynamics, and track-honed double-wishbone front suspension.","tags":"sports,supercar,track,porsche,coupe","types":[{"subProductId":"car_001_type_001","subTitle":"Pure White / Pyro Red","subImage":"https://placehold.co/1200x800/ffffff/000000?text=GT3+RS+White","images":["https://placehold.co/1200x800/ffffff/000000?text=GT3+RS+White+Front","https://placehold.co/1200x800/ffffff/000000?text=GT3+RS+White+Side+Profile","https://placehold.co/1200x800/ffffff/000000?text=GT3+RS+White+Rear+Diffuser","https://placehold.co/1200x800/ffffff/000000?text=GT3+RS+White+Bucket+Seats"],"subProducts":[{"subProductId":"car_001_type_001_sub_001","subTitle":"Forged Aluminum Wheels (20/21\")","subImage":"https://placehold.co/1200x800/ffffff/000000?text=Standard+Forged+Wheels","images":["https://placehold.co/1200x800/ffffff/000000?text=Standard+Forged+Wheels+Angle","https://placehold.co/1200x800/ffffff/000000?text=Standard+Forged+Wheels+Detail"]},{"subProductId":"car_001_type_001_sub_002","subTitle":"Weissach Lightweight Magnesium Wheels","subImage":"https://placehold.co/1200x800/ffffff/000000?text=Weissach+Magnesium","images":["https://placehold.co/1200x800/ffffff/000000?text=Weissach+Magnesium+Wheels","https://placehold.co/1200x800/ffffff/000000?text=Weissach+Magnesium+Carbon+Cap"],"price":275000}]},{"subProductId":"car_001_type_002","subTitle":"Black / Satin Dark Silver","subImage":"https://placehold.co/1200x800/171717/ffffff?text=GT3+RS+Black","images":["https://placehold.co/1200x800/171717/ffffff?text=GT3+RS+Black+Front","https://placehold.co/1200x800/171717/ffffff?text=GT3+RS+Black+Quarter+Panel","https://placehold.co/1200x800/171717/ffffff?text=GT3+RS+Black+Rear+Wing","https://placehold.co/1200x800/171717/ffffff?text=GT3+RS+Black+Alcantara+Interior"],"subProducts":[{"subProductId":"car_001_type_002_sub_001","subTitle":"Forged Aluminum Wheels (20/21\")","subImage":"https://placehold.co/1200x800/171717/ffffff?text=Standard+Forged+Wheels","images":["https://placehold.co/1200x800/171717/ffffff?text=Satin+Forged+Wheels","https://placehold.co/1200x800/171717/ffffff?text=Satin+Forged+Hub"]},{"subProductId":"car_001_type_002_sub_002","subTitle":"Weissach Lightweight Magnesium Wheels","subImage":"https://placehold.co/1200x800/171717/ffffff?text=Weissach+Magnesium","images":["https://placehold.co/1200x800/171717/ffffff?text=Black+Weissach+Magnesium","https://placehold.co/1200x800/171717/ffffff?text=Black+Weissach+Disc"],"price":275000}]},{"subProductId":"car_001_type_003","subTitle":"Arctic Grey / Carbon Package","subImage":"https://placehold.co/1200x800/334155/ffffff?text=GT3+RS+Arctic+Grey","images":["https://placehold.co/1200x800/334155/ffffff?text=GT3+RS+Arctic+Grey+Front","https://placehold.co/1200x800/334155/ffffff?text=GT3+RS+Arctic+Grey+Side","https://placehold.co/1200x800/334155/ffffff?text=GT3+RS+Arctic+Grey+Roof","https://placehold.co/1200x800/334155/ffffff?text=GT3+RS+Arctic+Grey+Cockpit"],"price":252000,"subProducts":[{"subProductId":"car_001_type_003_sub_001","subTitle":"Standard Aero Package","subImage":"https://placehold.co/1200x800/334155/ffffff?text=Carbon+Ceramic+Brakes","images":["https://placehold.co/1200x800/334155/ffffff?text=Standard+Aero+Package","https://placehold.co/1200x800/334155/ffffff?text=Carbon+Brakes+Detail"],"price":252000},{"subProductId":"car_001_type_003_sub_002","subTitle":"Weissach Full Carbon Aero Package","subImage":"https://placehold.co/1200x800/334155/ffffff?text=Weissach+Full+Carbon","images":["https://placehold.co/1200x800/334155/ffffff?text=Weissach+Full+Carbon+Hood","https://placehold.co/1200x800/334155/ffffff?text=Weissach+Full+Carbon+Wing"],"price":285000}]}],"content":"\u003ch1>Vehicle Overview\u003c/h1>\n\u003cp>The \u003cstrong>Porsche 911 GT3 RS\u003c/strong> is engineered for maximum motorsport performance on both road and circuit:\u003c/p>\n\u003ch3>Engine &amp; Performance Specifications\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Engine\u003c/strong>: 4.0L Naturally Aspirated Boxer-6\u003c/li>\n\u003cli>\u003cstrong>Horsepower\u003c/strong>: 518 hp @ 8,500 rpm\u003c/li>\n\u003cli>\u003cstrong>Torque\u003c/strong>: 342 lb-ft @ 6,300 rpm\u003c/li>\n\u003cli>\u003cstrong>0–60 mph\u003c/strong>: 3.0 seconds\u003c/li>\n\u003cli>\u003cstrong>Top Track Speed\u003c/strong>: 184 mph\u003c/li>\n\u003cli>\u003cstrong>Transmission\u003c/strong>: 7-speed Porsche Doppelkupplung (PDK) with paddle shifters\u003c/li>\n\u003c/ul>\n\u003ch3>Key Aerodynamic Innovations\u003c/h3>\n\u003cul>\n\u003cli>Central radiator concept inspired by the Le Mans-winning 911 RSR\u003c/li>\n\u003cli>Continuously adjustable active aero elements on front wing and two-part rear wing\u003c/li>\n\u003cli>Drag Reduction System (DRS) operated directly from the steering wheel\u003c/li>\n\u003cli>High downforce setup generating 900+ lbs of downforce at 124 mph\u003c/li>\n\u003c/ul>\n"},
        selectedGalleryImage: null,
        get galleryImages() {
          if (Array.isArray(this.car.images) && this.car.images.length > 0) return this.car.images;
          return this.car.imageSrc ? [this.car.imageSrc] : [];
        },
        get currentImage() {
          return this.selectedGalleryImage || this.galleryImages[0] || '';
        },
        get inquiryUrl() {
          const params = new URLSearchParams();
          if (this.car.id) params.set('car_id', this.car.id);
          if (this.car.title) params.set('vehicle', this.car.title);
          if (this.car.subtitle) params.set('trim', this.car.subtitle);
          if (this.car.price) params.set('est_price', this.car.price);
          return '../contact.html?' + params.toString();
        }
      }));
    });
  </script>
</body>
</html>
