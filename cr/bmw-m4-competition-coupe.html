<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BMW M4 Competition Coupe | Rawgadz Vehicles</title>
  <meta name="description" content="3.0-liter BMW M TwinPower Turbo inline 6-cylinder engine with 523 hp, M xDrive all-wheel drive, and adaptive M suspension.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/stock.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FBFBFB] text-neutral-900 font-sans antialiased selection:bg-black selection:text-white pb-20">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../car.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Cars
      </a>
      <a href="../index.html" class="font-black text-lg tracking-wider text-black uppercase hover:opacity-80 transition-opacity">Rawgadz</a>
      <div class="w-20"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-10" x-data="carPage">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <div class="lg:col-span-7">
        <div class="aspect-video bg-neutral-100 rounded-2xl overflow-hidden border border-neutral-200 mb-4 shadow-sm">
          <img :src="currentImage" :alt="car.title" class="w-full h-full object-cover">
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-2" x-show="galleryImages.length > 1">
          <template x-for="(img, idx) in galleryImages" :key="idx">
            <button @click="selectedGalleryImage = img" class="w-20 h-14 rounded-lg overflow-hidden border-2 transition-all flex-shrink-0" :class="currentImage === img ? 'border-black' : 'border-transparent opacity-60 hover:opacity-100'">
              <img :src="img" class="w-full h-full object-cover">
            </button>
          </template>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap gap-2 mb-3"><span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">coupe</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">bmw</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">turbo</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">sports</span>
             <span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">track</span></div>
          <h1 class="text-3xl md:text-4xl font-black tracking-tight text-neutral-900 mb-2" x-text="car.title"></h1>
          <p class="text-sm text-neutral-500 font-medium mb-4" x-text="car.subtitle"></p>
          <div class="text-2xl font-black text-black mb-6">
            Starting at ৳<span x-text="Number(car.price || 0).toLocaleString()"></span>
          </div>

          <div class="text-neutral-600 text-sm leading-relaxed mb-6" x-text="car.description"></div>

          <div class="border-t border-neutral-200 pt-6 mt-6">
            <a href="../contact.html" class="w-full bg-black hover:bg-neutral-800 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-sm uppercase tracking-wider transition-all">
              Inquire About Vehicle
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-16 border-t border-neutral-200 pt-10" x-show="car.content">
      <h2 class="text-2xl font-black tracking-tight mb-6">Specifications & Details</h2>
      <div class="prose max-w-none text-neutral-700 bg-white p-6 md:p-8 rounded-2xl border border-neutral-200" x-html="car.content"></div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carPage', () => ({
        car: {"id":"car_004","title":"BMW M4 Competition Coupe","slug":"bmw-m4-competition-coupe","subtitle":"","price":83200,"imageSrc":"https://placehold.co/1200x800/171717/ffffff?text=BMW+M4+Competition","images":["https://placehold.co/1200x800/171717/ffffff?text=BMW+M4+Front+Kidney+Grille","https://placehold.co/1200x800/171717/ffffff?text=BMW+M4+Coupe+Profile","https://placehold.co/1200x800/171717/ffffff?text=BMW+M4+Quad+Exhaust","https://placehold.co/1200x800/171717/ffffff?text=BMW+M4+Carbon+Cockpit"],"video":"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4","description":"3.0-liter BMW M TwinPower Turbo inline 6-cylinder engine with 523 hp, M xDrive all-wheel drive, and adaptive M suspension.","tags":"coupe,bmw,turbo,sports,track","types":[{"subProductId":"car_004_type_001","subTitle":"Sao Paulo Yellow / M Carbon Bucket Seats","subImage":"https://placehold.co/1200x800/ca8a04/ffffff?text=Sao+Paulo+Yellow","images":["https://placehold.co/1200x800/ca8a04/ffffff?text=Sao+Paulo+Yellow+Front","https://placehold.co/1200x800/ca8a04/ffffff?text=Sao+Paulo+Yellow+Profile","https://placehold.co/1200x800/ca8a04/ffffff?text=Sao+Paulo+Yellow+Rear+Angle","https://placehold.co/1200x800/ca8a04/ffffff?text=Sao+Paulo+Yellow+M+Bucket+Seats"],"subProducts":[{"subProductId":"car_004_type_001_sub_001","subTitle":"19\"/20\" M Double-Spoke Black Wheels","subImage":"https://placehold.co/1200x800/ca8a04/ffffff?text=M+Double+Spoke+Wheels","images":["https://placehold.co/1200x800/ca8a04/ffffff?text=M+Double+Spoke+Wheels+Side","https://placehold.co/1200x800/ca8a04/ffffff?text=M+Double+Spoke+Wheels+Rim"]},{"subProductId":"car_004_type_001_sub_002","subTitle":"M Carbon Ceramic Brake Package","subImage":"https://placehold.co/1200x800/ca8a04/ffffff?text=M+Carbon+Ceramic","images":["https://placehold.co/1200x800/ca8a04/ffffff?text=Gold+M+Carbon+Ceramic+Calipers","https://placehold.co/1200x800/ca8a04/ffffff?text=Drilled+Carbon+Ceramic+Rotors"],"price":92200}]},{"subProductId":"car_004_type_002","subTitle":"Isle of Man Green / Kyalami Orange Interior","subImage":"https://placehold.co/1200x800/0369a1/ffffff?text=Isle+of+Man+Green","images":["https://placehold.co/1200x800/0369a1/ffffff?text=Isle+of+Man+Green+Front","https://placehold.co/1200x800/0369a1/ffffff?text=Isle+of+Man+Green+Side","https://placehold.co/1200x800/0369a1/ffffff?text=Kyalami+Orange+Leather+Interior","https://placehold.co/1200x800/0369a1/ffffff?text=M4+Curved+Display"],"subProducts":[{"subProductId":"car_004_type_002_sub_001","subTitle":"19\"/20\" Bicolor Style 826M Wheels","subImage":"https://placehold.co/1200x800/0369a1/ffffff?text=Standard+Wheels","images":["https://placehold.co/1200x800/0369a1/ffffff?text=Bicolor+826M+Wheels"]},{"subProductId":"car_004_type_002_sub_002","subTitle":"M Driver's Package (180 mph limiter unlock)","subImage":"https://placehold.co/1200x800/0369a1/ffffff?text=M+Driver+Package","images":["https://placehold.co/1200x800/0369a1/ffffff?text=M+Drivers+Track+Package"],"price":88500}]}],"content":"\u003ch1>Vehicle Overview\u003c/h1>\n\u003cp>The \u003cstrong>BMW M4 Competition Coupe\u003c/strong> delivers aggressive performance with daily precision:\u003c/p>\n\u003ch3>Engine &amp; Drivetrain\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Engine\u003c/strong>: 3.0L BMW M TwinPower Turbo Inline-6 (S58)\u003c/li>\n\u003cli>\u003cstrong>Power\u003c/strong>: 523 hp @ 6,250 rpm\u003c/li>\n\u003cli>\u003cstrong>Torque\u003c/strong>: 479 lb-ft @ 2,750–5,730 rpm\u003c/li>\n\u003cli>\u003cstrong>0–60 mph\u003c/strong>: 3.4 seconds\u003c/li>\n\u003cli>\u003cstrong>Transmission\u003c/strong>: 8-speed M Sport Automatic with Drivelogic\u003c/li>\n\u003cli>\u003cstrong>Drivetrain\u003c/strong>: M xDrive with selectable 4WD, 4WD Sport, and 2WD pure rear-wheel drive modes\u003c/li>\n\u003c/ul>\n"},
        selectedGalleryImage: null,
        get galleryImages() {
          if (Array.isArray(this.car.images) && this.car.images.length > 0) return this.car.images;
          return this.car.imageSrc ? [this.car.imageSrc] : [];
        },
        get currentImage() {
          return this.selectedGalleryImage || this.galleryImages[0] || '';
        }
      }));
    });
  </script>
</body>
</html>
