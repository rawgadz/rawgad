<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leather Semi-Perforated Steering Wheel Cover | Rawgadz | Rawgadz</title>
  <meta name="description" content="This breathable massage-grip steering cover relieves driving fatigue and shields against sun damage with a cool, non-slip hold.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/stock.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FBFBFB] text-neutral-900 font-sans antialiased selection:bg-black selection:text-white pb-20">

  <!-- Sticky Navbar -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html#shop" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Shop
      </a>
      <a href="../index.html" class="font-black text-lg tracking-wider text-black uppercase hover:opacity-80 transition-opacity">Rawgadz</a>
      <a href="../checkout.html" class="relative p-2 text-neutral-700 hover:text-black transition-colors" x-data="{ count: 0 }" x-init="count = Object.values(JSON.parse(localStorage.getItem('main_store_cart') || '{}')).reduce((a, b) => a + (b.quantity || 1), 0); window.addEventListener('cart-update-main_store_cart', () => { count = Object.values(JSON.parse(localStorage.getItem('main_store_cart') || '{}')).reduce((a, b) => a + (b.quantity || 1), 0); });">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
        <span x-show="count > 0" x-text="count" class="absolute top-1 right-1 bg-black text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center"></span>
      </a>
    </div>
  </header>

  <!-- Product Container -->
  <main class="max-w-6xl mx-auto px-4 pt-8" x-data="productPage">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
      
      <!-- Gallery Column -->
      <div class="lg:col-span-7">
        <div class="sticky top-24">
          <div class="aspect-square bg-neutral-100 rounded-3xl overflow-hidden border border-neutral-200 mb-4 shadow-sm relative">
            <img :src="currentImage" :alt="activeVariantTitle" class="w-full h-full object-cover">
            
            <template x-if="currentVariantImages.length > 1">
              <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 flex justify-between pointer-events-none">
                <button @click="prevGalleryImage" class="pointer-events-auto w-10 h-10 rounded-full bg-white/90 shadow-md flex items-center justify-center text-black hover:bg-white transition-all">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button @click="nextGalleryImage" class="pointer-events-auto w-10 h-10 rounded-full bg-white/90 shadow-md flex items-center justify-center text-black hover:bg-white transition-all">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              </div>
            </template>
          </div>

          <!-- Thumbnails -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" x-show="currentVariantImages.length > 1">
            <template x-for="(img, idx) in currentVariantImages" :key="idx">
              <button @click="selectedGalleryImage = img" class="w-16 h-16 rounded-xl overflow-hidden border-2 transition-all flex-shrink-0" :class="currentImage === img ? 'border-black' : 'border-transparent opacity-60 hover:opacity-100'">
                <img :src="img" class="w-full h-full object-cover">
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- Info Column -->
      <div class="lg:col-span-5 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap gap-2 mb-3"><span class="bg-neutral-100 text-neutral-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-neutral-200">Car Accessories</span></div>
          <h1 class="text-2xl md:text-3xl font-black tracking-tight text-neutral-900 mb-2" x-text="product.title"></h1>
          
          <div class="flex items-baseline gap-3 mb-6">
            <span class="text-3xl font-black text-black">৳<span x-text="currentPrice"></span></span>
            <!-- Stock Status Badge -->
            <span class="text-[11px] font-black uppercase px-2.5 py-1 rounded-full border"
              :class="{
                'bg-emerald-50 text-emerald-700 border-emerald-200': stockStatus === 'in_stock',
                'bg-amber-50 text-amber-700 border-amber-200': stockStatus === 'low_stock',
                'bg-rose-50 text-rose-700 border-rose-200': stockStatus === 'out_of_stock'
              }"
              x-text="stockStatus === 'in_stock' ? 'In Stock' : (stockStatus === 'low_stock' ? ('Low Stock (' + currentStock + ')') : 'Out of Stock')">
            </span>
          </div>

          <!-- Type Selection -->
          <template x-if="product.types && product.types.length > 0">
            <div class="mb-6">
              <label class="block text-xs font-bold uppercase tracking-wider text-neutral-500 mb-2.5">
                Type: <span class="text-black font-black" x-text="selectedType?.subTitle"></span>
              </label>
              <div class="flex flex-wrap gap-2.5">
                <template x-for="(type, tIdx) in product.types" :key="tIdx">
                  <button @click="selectType(tIdx)" class="px-4 py-2 rounded-xl text-xs font-bold border transition-all flex items-center gap-2" :class="selectedTypeIndex === tIdx ? 'border-black bg-black text-white' : 'border-neutral-200 bg-white text-neutral-700 hover:border-neutral-400'">
                    <span x-text="type.subTitle"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <!-- SubProduct Selection -->
          <template x-if="selectedType && selectedType.subProducts && selectedType.subProducts.length > 0">
            <div class="mb-6">
              <label class="block text-xs font-bold uppercase tracking-wider text-neutral-500 mb-2.5">
                Option: <span class="text-black font-black" x-text="selectedSubProduct?.subTitle"></span>
              </label>
              <div class="flex flex-wrap gap-2.5">
                <template x-for="(sub, sIdx) in selectedType.subProducts" :key="sIdx">
                  <button @click="selectSubProduct(sIdx)" class="px-4 py-2 rounded-xl text-xs font-bold border transition-all" :class="selectedSubProductIndex === sIdx ? 'border-black bg-black text-white' : 'border-neutral-200 bg-white text-neutral-700 hover:border-neutral-400'">
                    <span x-text="sub.subTitle"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <!-- Action Buttons -->
          <div class="space-y-3 pt-4 border-t border-neutral-200">
            <template x-if="!isOutOfStock">
              <div class="flex gap-3">
                <div class="flex items-center border border-neutral-300 rounded-xl bg-white overflow-hidden">
                  <button @click="updateCart(inCartQuantity - 1)" class="px-3.5 py-3 hover:bg-neutral-100 transition-colors font-bold text-neutral-600">-</button>
                  <span class="w-10 text-center font-black text-sm" x-text="inCartQuantity"></span>
                  <button @click="updateCart(inCartQuantity + 1)" class="px-3.5 py-3 hover:bg-neutral-100 transition-colors font-bold text-neutral-600">+</button>
                </div>
                <button @click="buyNow" class="flex-1 bg-black hover:bg-neutral-800 text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-sm uppercase tracking-wider transition-all">
                  Buy Now
                </button>
              </div>
            </template>
            <template x-if="isOutOfStock">
              <button disabled class="w-full bg-neutral-200 text-neutral-500 font-bold py-3.5 px-6 rounded-xl text-sm uppercase tracking-wider cursor-not-allowed">
                Out of Stock
              </button>
            </template>
          </div>

          <div class="mt-8 text-neutral-600 text-sm leading-relaxed" x-text="product.description"></div>
        </div>
      </div>
    </div>

    <!-- Long Content Section -->
    <div class="mt-16 border-t border-neutral-200 pt-10" x-show="product.content">
      <h2 class="text-xl font-black tracking-tight mb-6">Product Details</h2>
      <div class="prose max-w-none text-neutral-700 bg-white p-6 md:p-8 rounded-2xl border border-neutral-200" x-html="product.content"></div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('productPage', () => ({
        product: {"id":"MRA-24","slug":"leather-semi-perforated-steering-wheel-cover-rawgadz","tab":"normal","imageSrc":"https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01PtYnHz25tz6cStEYd_2756927585-0-cib.webp","images":["https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01PtYnHz25tz6cStEYd_2756927585-0-cib.webp"],"title":"Leather Semi-Perforated Steering Wheel Cover | Rawgadz","description":"This breathable massage-grip steering cover relieves driving fatigue and shields against sun damage with a cool, non-slip hold.","price":1860,"priceRange":{"min":1860,"max":1860},"tags":"Car Accessories","types":[{"subProductId":"MRA-2401","subImage":"https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01PtYnHz25tz6cStEYd_2756927585-0-cib.webp","images":["https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01PtYnHz25tz6cStEYd_2756927585-0-cib.webp"],"subTitle":"Black and Red","price":1860},{"subProductId":"MRA-2402","subImage":"https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01zKWp3z25tz6gQhW6C_2756927585-0-cib.webp","images":["https://res.cloudinary.com/mltcbcft/image/upload/v1790440811/O1CN01zKWp3z25tz6gQhW6C_2756927585-0-cib.webp"],"subTitle":"Black and Grey","price":1860},{"subProductId":"MRA-2403","subImage":"https://res.cloudinary.com/mltcbcft/image/upload/v1790440810/O1CN01Jpq07N25tz6eODC9c_2756927585-0-cib.webp","images":["https://res.cloudinary.com/mltcbcft/image/upload/v1790440810/O1CN01Jpq07N25tz6eODC9c_2756927585-0-cib.webp"],"subTitle":"Black","price":1860}],"content":"\u003cp>Upgrade your driving comfort and interior protection with the Massage Grip Semi-Perforated Car Steering Wheel Cover.\u003c/p>\n\u003cp>Factory-Direct Quality | Sun-Proof &amp; Breathable | Universal Fit (14.5–15&quot;)\u003c/p>\n\u003cp>\u003cstrong>✅ Ergonomic Massage Grip:\u003c/strong> Integrated micro-massage nodules relieve hand fatigue and tension during daily commutes and long highway trips\u003cbr>\u003cstrong>✅ Semi-Perforated Breathability:\u003c/strong> Air-permeable finish actively dissipates heat and palm sweat for a dry, cool grip in extreme summer weather\u003cbr>\u003cstrong>✅ Complete UV &amp; Sun Protection:\u003c/strong> Shields your factory steering wheel from harsh solar rays to prevent surface fading, drying, and cracking\u003cbr>\u003cstrong>✅ Four-Season Durability:\u003c/strong> Engineered from heavy-duty, all-weather materials that stay pliable, non-slip, and crack-resistant year-round\u003cbr>\u003cstrong>✅ Universal Quick-Fit:\u003c/strong> Stretches securely over standard 14.5 to 15-inch steering wheels across sedans, SUVs, and hatchbacks in seconds\u003cbr>\u003cstrong>✅ Sporty Modern Aesthetic:\u003c/strong> Clean two-tone perforated design instantly refreshes your vehicle cabin with a contemporary, high-end look\u003cbr>\u003cstrong>✅ Cash on Delivery:\u003c/strong> Inspect your product at doorstep delivery before paying (available for verified buyers)\u003c/p>\n\u003cp>\u003cstrong>Return Policy:\u003c/strong>\u003cbr>\u003cem>\u003cstrong>If any product is faulty, you can return it within 7 days of receiving it.\u003c/strong>\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Our Promise:\u003c/strong>\u003cbr>Selling high-quality and unique products is our commitment.\u003cbr>\u003cstrong>If you receive a defective or poor-quality product, you can return it and we will refund your money.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>📞 For Returns &amp; Inquiries (Call / WhatsApp): 01608-331322\u003c/strong>\u003c/p>\n"},
        selectedTypeIndex: 0,
        selectedSubProductIndex: 0,
        selectedGalleryImage: null,
        inCartQuantity: 0,
        inventoryMap: {},
        availabilityMap: {},
        loadingInventory: true,

        init() {
          this.syncCart();
          this.loadInventory();
          window.addEventListener('storage', () => this.syncCart());
          window.addEventListener('cart-update-main_store_cart', () => this.syncCart());
          window.addEventListener('rawgad-stock-updated', () => this.loadInventory());
        },

        loadInventory() {
          if (window.RawgadStock) {
            const cachedMap = window.RawgadStock.getProductStockMap(this.product.id);
            const cachedAvail = window.RawgadStock.getProductAvailabilityMap(this.product.id);
            if (cachedMap && Object.keys(cachedMap).length > 0) {
              this.inventoryMap = cachedMap;
              this.availabilityMap = cachedAvail;
              this.loadingInventory = false;
              return;
            }
            window.RawgadStock.fetchAndStoreAllStock().then(() => {
              this.inventoryMap = window.RawgadStock.getProductStockMap(this.product.id);
              this.availabilityMap = window.RawgadStock.getProductAvailabilityMap(this.product.id);
              this.loadingInventory = false;
            }).catch(() => { this.loadingInventory = false; });
          }
        },

        get selectedType() {
          if (!this.product.types || this.product.types.length === 0) return null;
          return this.product.types[this.selectedTypeIndex] || this.product.types[0];
        },

        get selectedSubProduct() {
          const type = this.selectedType;
          if (!type || !type.subProducts || type.subProducts.length === 0) return null;
          return type.subProducts[this.selectedSubProductIndex] || type.subProducts[0];
        },

        get activeVariantTitle() {
          const type = this.selectedType;
          const sub = this.selectedSubProduct;
          if (type && sub) return type.subTitle + ' - ' + sub.subTitle;
          if (type) return type.subTitle;
          return this.product.title;
        },

        get currentVariantImages() {
          if (this.selectedSubProduct && Array.isArray(this.selectedSubProduct.images) && this.selectedSubProduct.images.length > 1) {
            return this.selectedSubProduct.images;
          }
          if (this.selectedType && Array.isArray(this.selectedType.images) && this.selectedType.images.length > 1) {
            return this.selectedType.images;
          }

          const variantImg = this.selectedSubProduct?.subImage || this.selectedSubProduct?.images?.[0]
            || this.selectedType?.subImage || this.selectedType?.images?.[0];

          const prodImages = Array.isArray(this.product.images) && this.product.images.length > 0
            ? this.product.images
            : (this.product.imageSrc ? [this.product.imageSrc] : []);

          if (variantImg) {
            const combined = [variantImg];
            for (const img of prodImages) {
              if (!combined.includes(img)) {
                combined.push(img);
              }
            }
            if (combined.length > 1) return combined;
          }

          if (prodImages.length > 0) return prodImages;
          return variantImg ? [variantImg] : [];
        },

        get currentImage() {
          if (this.selectedGalleryImage && this.currentVariantImages.includes(this.selectedGalleryImage)) return this.selectedGalleryImage;
          return this.currentVariantImages[0] || this.product.imageSrc;
        },

        get currentPrice() {
          if (this.selectedSubProduct && typeof this.selectedSubProduct.price === 'number') return this.selectedSubProduct.price;
          if (this.selectedType && typeof this.selectedType.price === 'number') return this.selectedType.price;
          return Number(this.product.price) || 0;
        },

        get currentStock() {
          const type = this.selectedType;
          const sub = this.selectedSubProduct;
          const typeId = type ? String(type.subProductId || type.id) : '_';
          const subId = sub ? String(sub.subProductId || sub.id) : '_';
          if (window.RawgadStock) {
            return window.RawgadStock.getItemStock(this.product.id, typeId, subId);
          }
          return 0;
        },

        get isAvailable() {
          const type = this.selectedType;
          const sub = this.selectedSubProduct;
          const typeId = type ? String(type.subProductId || type.id) : '_';
          const subId = sub ? String(sub.subProductId || sub.id) : '_';
          if (window.RawgadStock) {
            return window.RawgadStock.isItemAvailable(this.product.id, typeId, subId);
          }
          return true;
        },

        get stockStatus() {
          if (this.loadingInventory) return 'in_stock';
          if (!this.isAvailable) return 'out_of_stock';
          const s = this.currentStock;
          if (typeof s === 'number' && s > 0 && s <= 5) return 'low_stock';
          return 'in_stock';
        },

        get isOutOfStock() { return !this.loadingInventory && !this.isAvailable; },

        selectType(index) {
          this.selectedTypeIndex = Number(index) || 0;
          this.selectedSubProductIndex = 0;
          this.selectedGalleryImage = null;
          this.syncCart();
        },

        selectSubProduct(index) {
          this.selectedSubProductIndex = Number(index) || 0;
          this.selectedGalleryImage = null;
          this.syncCart();
        },

        prevGalleryImage() {
          const imgs = this.currentVariantImages;
          if (!imgs || imgs.length <= 1) return;
          const idx = imgs.indexOf(this.currentImage);
          this.selectedGalleryImage = imgs[(idx <= 0 ? imgs.length - 1 : idx - 1)];
        },

        nextGalleryImage() {
          const imgs = this.currentVariantImages;
          if (!imgs || imgs.length <= 1) return;
          const idx = imgs.indexOf(this.currentImage);
          this.selectedGalleryImage = imgs[(idx === -1 || idx >= imgs.length - 1 ? 0 : idx + 1)];
        },

        getCartKey() {
          const type = this.selectedType;
          const sub = this.selectedSubProduct;
          const pId = this.product.id;
          const tId = type ? String(type.subProductId || type.id) : '_';
          const sId = sub ? String(sub.subProductId || sub.id) : '_';
          return pId + ':::' + tId + ':::' + sId;
        },

        getCart() { try { return JSON.parse(localStorage.getItem('main_store_cart')) || {}; } catch (e) { return {}; } },

        setCart(cart) {
          try {
            localStorage.setItem('main_store_cart', JSON.stringify(cart));
            window.dispatchEvent(new Event('cart-update-main_store_cart'));
          } catch (e) { console.error('Failed to save cart:', e); }
        },

        syncCart() {
          const key = this.getCartKey();
          const cart = this.getCart();
          const item = cart[key];
          this.inCartQuantity = (item && item.quantity) ? item.quantity : 0;
        },

        updateCart(newQty) {
          if (newQty < 0) return;
          if (this.isOutOfStock && newQty > 0) return;

          const key = this.getCartKey();
          const type = this.selectedType;
          const sub = this.selectedSubProduct;
          const cart = this.getCart();

          if (newQty === 0) {
            delete cart[key];
          } else {
            let titleSuffix = '';
            if (type && sub) titleSuffix = ' (' + type.subTitle + ' - ' + sub.subTitle + ')';
            else if (type) titleSuffix = ' (' + type.subTitle + ')';

            const typeId = type ? String(type.subProductId || type.id) : null;
            const subProductId = sub ? String(sub.subProductId || sub.id) : null;
            const itemName = sub ? sub.subTitle : (type ? type.subTitle : this.product.title);

            cart[key] = {
              cartKey: key,
              id: this.product.id,
              typeId: typeId,
              subProductId: subProductId,
              name: itemName,
              title: this.product.title + titleSuffix,
              price: this.currentPrice,
              imageSrc: this.currentImage,
              quantity: newQty
            };
          }
          this.setCart(cart);
          this.syncCart();
        },

        buyNow() {
          if (this.isOutOfStock) return;
          if (this.inCartQuantity === 0) this.updateCart(1);
          if (this.inCartQuantity > 0) window.location.href = '../checkout.html';
        }
      }));
    });
  </script>
</body>
</html>
